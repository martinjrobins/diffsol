[package]
name = "diffsol-la"
version = "0.2.0"
edition.workspace = true
description = "Linear algebra traits and backends (vectors, matrices, linear solvers) for diffsol."
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords = ["linear-algebra", "matrix", "vector", "solver", "math"]
readme = "README.md"

[features]
default = ["nalgebra", "faer"]
faer = []
nalgebra = []
cuda = ["dep:cudarc"]
# CUDA backend with kernels written in Rust via NVlabs cuda-oxide. Requires
# `cargo oxide` on the pinned nightly; see README.
cuda-oxide = ["dep:cuda-device", "dep:cuda-host", "dep:cuda-core", "dep:cudarc"]
suitesparse = ["dep:suitesparse_sys"]
algebraic-ops = []

[dependencies]
nalgebra = { workspace = true }
num-traits = { workspace = true }
thiserror = "2.0"
faer-traits = { workspace = true }
suitesparse_sys = { version = "0.1", optional = true }
cudarc = { workspace = true, optional = true, default-features = false, features = [
  "cuda-version-from-build-system",
  "cusolver",
  "dynamic-linking",
  "std",
  "cublas",
  "cublaslt",
  "curand",
  "driver",
  "runtime",
  "nvrtc",
] }

# cuda-oxide: device/host glue is git-only, the host runtime is on crates.io.
cuda-device = { git = "https://github.com/NVlabs/cuda-oxide.git", rev = "26754ae52c26c097dc1c465a1e42c4c5d05a3d40", optional = true }
cuda-host = { git = "https://github.com/NVlabs/cuda-oxide.git", rev = "26754ae52c26c097dc1c465a1e42c4c5d05a3d40", optional = true }
cuda-core = { version = "0.3.1", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
faer = { workspace = true, features = ["rayon"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
faer = { workspace = true }

[dev-dependencies]
paste = { workspace = true }

[package]
name = "diffsol-c"
version = "0.8.0"
edition.workspace = true
description = "A diffsol wrapper featuring runtime scalar/matrix/solver types and a C API"
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords = ["ode", "solver", "math", "simulation", "science"]
readme = "README.md"

[lib]
# a static library is made only on request:
# `cargo rustc -p diffsol-c --release --lib --crate-type staticlib`
crate-type = ["cdylib", "rlib"]

[features]
default = ["diffsl-external-dynamic"]
wasm = ["getrandom/js"]
external = []
external-dynamic = []
diffsl-external-f64 = [
  "external",
  "diffsol/diffsl-external-f64",
  "diffsl/external_f64",
]
diffsl-external-f32 = [
  "external",
  "diffsol/diffsl-external-f32",
  "diffsl/external_f32",
]
diffsl-external-dynamic = [
  "external-dynamic",
  "diffsol/diffsl-external-dynamic",
]
diffsl-cranelift = ["diffsol/diffsl-cranelift"]
diffsl-llvm = []
diffsl-llvm15 = ["diffsol/diffsl-llvm15", "diffsl-llvm"]
diffsl-llvm16 = ["diffsol/diffsl-llvm16", "diffsl-llvm"]
diffsl-llvm17 = ["diffsol/diffsl-llvm17", "diffsl-llvm"]
diffsl-llvm18 = ["diffsol/diffsl-llvm18", "diffsl-llvm"]
diffsl-llvm19 = ["diffsol/diffsl-llvm19", "diffsl-llvm"]
diffsl-llvm20 = ["diffsol/diffsl-llvm20", "diffsl-llvm"]
diffsl-llvm21 = ["diffsol/diffsl-llvm21", "diffsl-llvm"]
# the same as the features above, but link LLVM as a shared library (libLLVM) if it is available
diffsl-llvm15-prefer-dynamic = ["diffsl-llvm15", "diffsol/diffsl-llvm15-prefer-dynamic"]
diffsl-llvm16-prefer-dynamic = ["diffsl-llvm16", "diffsol/diffsl-llvm16-prefer-dynamic"]
diffsl-llvm17-prefer-dynamic = ["diffsl-llvm17", "diffsol/diffsl-llvm17-prefer-dynamic"]
diffsl-llvm18-prefer-dynamic = ["diffsl-llvm18", "diffsol/diffsl-llvm18-prefer-dynamic"]
diffsl-llvm19-prefer-dynamic = ["diffsl-llvm19", "diffsol/diffsl-llvm19-prefer-dynamic"]
diffsl-llvm20-prefer-dynamic = ["diffsl-llvm20", "diffsol/diffsl-llvm20-prefer-dynamic"]
diffsl-llvm21-prefer-dynamic = ["diffsl-llvm21", "diffsol/diffsl-llvm21-prefer-dynamic"]
suitesparse = ["diffsol/suitesparse"]

[dependencies]
diffsl = { workspace = true }
diffsol = { path = "../diffsol", version = "0.19.0", features = ["diffsl"] }
dlmalloc = { version = "0.2", features = ["global"] }
nalgebra = { workspace = true, features = ["std"] }
ndarray = { version = "0.17" }
num-traits = { workspace = true }
schemars = "1.2"
serde = { workspace = true }
serde_json = { workspace = true }
paste = { workspace = true }

[build-dependencies]
cbindgen = { version = "0.29", default-features = false }


[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
faer = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = { version = "0.2", optional = true }
faer = { workspace = true, features = ["rayon"] }

[package.metadata.docs.rs]
features = ["diffsl-cranelift", "diffsl-external-dynamic", "diffsl-external-f64"]

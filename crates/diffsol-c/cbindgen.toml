# Configuration of the C header that build.rs generates with cbindgen.
language = "C"
include_guard = "DIFFSOL_H"
autogen_warning = "/* This file is generated by the build script of diffsol-c (cbindgen). Do not edit it. */"
cpp_compat = true
usize_is_size_t = true
documentation = true
documentation_style = "c99"
sys_includes = ["stddef.h", "stdint.h", "stdbool.h"]
no_includes = true

[defines]
# build.rs defines the macro of each enabled feature at the top of the header
"feature = external" = "DIFFSOL_EXTERNAL"
"feature = diffsl-external-f64" = "DIFFSOL_DIFFSL_EXTERNAL_F64"
"feature = diffsl-external-f32" = "DIFFSOL_DIFFSL_EXTERNAL_F32"
"feature = diffsl-external-dynamic" = "DIFFSOL_DIFFSL_EXTERNAL_DYNAMIC"
"feature = diffsl-cranelift" = "DIFFSOL_DIFFSL_CRANELIFT"
"feature = diffsl-llvm" = "DIFFSOL_DIFFSL_LLVM"
"feature = suitesparse" = "DIFFSOL_SUITESPARSE"

[export]
# the function pointer types of the callbacks API, which only the descriptor structs use
include = ["DiffsolOdeCallbacksF64", "DiffsolOdeCallbacksF32"]

[fn]
args = "Vertical"

[export.rename]
# a generic name in the global C namespace
"MAX_NDIM" = "DIFFSOL_TENSOR_MAX_NDIM"

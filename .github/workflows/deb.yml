name: Debian packages

# Build the Debian packages of diffsol-c (libdiffsol<soversion> and libdiffsol-dev) for each
# supported distribution, for amd64 and arm64. Each build links the LLVM package of its
# distribution dynamically. Test the packages on clean systems and (with `publish`) upload them to
# the GitHub release and to the Cloudsmith APT repository.
#
# release-plz.yml calls this workflow when it releases diffsol-c. The packaging is in
# crates/diffsol-c/debian.

on:
  workflow_call:
    inputs:
      tag:
        description: "The tag of the GitHub release to upload the packages to"
        type: string
        default: ""
      publish:
        description: "Upload the packages to the GitHub release and to Cloudsmith"
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      tag:
        description: "The tag of the GitHub release to upload the packages to"
        type: string
        default: ""
      publish:
        description: "Upload the packages to the GitHub release and to Cloudsmith"
        type: boolean
        default: false
  pull_request:
    branches: ["main"]
    paths:
      - "crates/diffsol-c/debian/**"
      - "crates/diffsol-c/build.rs"
      - "crates/diffsol-c/examples/c/**"
      - ".github/workflows/deb.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target.codename }}, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        # `llvm` is the LLVM version of the distribution that the packages link with
        target:
          - { distro: debian, codename: bookworm, image: "debian:12", llvm: "19" }
          - { distro: debian, codename: trixie, image: "debian:13", llvm: "19" }
          - { distro: ubuntu, codename: jammy, image: "ubuntu:22.04", llvm: "15" }
          - { distro: ubuntu, codename: noble, image: "ubuntu:24.04", llvm: "19" }
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.target.image }}
    env:
      DEB_CODENAME: ${{ matrix.target.codename }}
      LLVM_VERSION: ${{ matrix.target.llvm }}
    steps:
      - name: Install the build tools and LLVM
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential debhelper devscripts \
            lintian pkg-config curl ca-certificates git cmake binutils \
            llvm-${LLVM_VERSION}-dev libclang-${LLVM_VERSION}-dev \
            zlib1g-dev libzstd-dev libedit-dev libncurses-dev libffi-dev libxml2-dev
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v6
        with:
          submodules: false
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: deb-${{ matrix.target.codename }}-${{ matrix.arch }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: deb-${{ matrix.target.codename }}-${{ matrix.arch }}-
      - name: Build the packages
        working-directory: crates/diffsol-c
        run: |
          debian/prepare.sh
          dpkg-buildpackage -b -us -uc -d
      - name: Show the packages
        run: |
          for deb in crates/*.deb; do
            echo "== $deb"
            dpkg-deb --info "$deb"
            dpkg-deb --contents "$deb"
          done
          # dpkg-buildpackage installed the library as libdiffsol.so.<version>
          readelf -d crates/diffsol-c/debian/tmp/usr/lib/*/libdiffsol.so.*.*.* | grep -E 'SONAME|NEEDED'
      - name: Lintian
        # warnings only: the packages are not for the Debian archive
        run: lintian --info --no-tag-display-limit crates/*.changes || true
      - uses: actions/upload-artifact@v4
        with:
          name: debs-${{ matrix.target.distro }}-${{ matrix.target.codename }}-${{ matrix.arch }}
          path: crates/*.deb
          if-no-files-found: error

  test:
    name: Test (${{ matrix.target.codename }}, ${{ matrix.arch }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        target:
          - { distro: debian, codename: bookworm, image: "debian:12" }
          - { distro: debian, codename: trixie, image: "debian:13" }
          - { distro: ubuntu, codename: jammy, image: "ubuntu:22.04" }
          - { distro: ubuntu, codename: noble, image: "ubuntu:24.04" }
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.target.image }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: crates/diffsol-c/examples
      - uses: actions/download-artifact@v4
        with:
          name: debs-${{ matrix.target.distro }}-${{ matrix.target.codename }}-${{ matrix.arch }}
          path: debs
      - name: Install the packages
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          # apt installs the dependencies, for example the LLVM library of the distribution
          apt-get install -y --no-install-recommends ./debs/*.deb build-essential pkg-config
      - name: Check the library
        run: |
          readelf -d /usr/lib/*/libdiffsol.so.*.*.* | grep -E 'SONAME|NEEDED'
          # every dependency, including libLLVM, must be found
          if ldd /usr/lib/*/libdiffsol.so.*.*.* | grep 'not found'; then exit 1; fi
          ldd /usr/lib/*/libdiffsol.so.*.*.* | grep libLLVM
          pkg-config --modversion diffsol
      - name: Compile and run the C examples
        run: |
          for example in logistic_callbacks logistic_diffsl_jit; do
            cc -std=c11 -Wall -Wextra -Werror "crates/diffsol-c/examples/c/$example.c" \
              $(pkg-config --cflags --libs diffsol) -lm -o "$example"
            "./$example"
          done
          # the JIT example uses Cranelift by default; also run it with LLVM
          DIFFSOL_JIT_BACKEND=llvm ./logistic_diffsl_jit

  publish:
    name: Publish
    needs: test
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
      CLOUDSMITH_REPOSITORY: ${{ vars.CLOUDSMITH_REPOSITORY }}
    steps:
      # one directory for each build: debs/debs-<distro>-<codename>-<arch>
      - uses: actions/download-artifact@v4
        with:
          pattern: debs-*
          path: debs
      - name: Upload to the GitHub release
        if: ${{ inputs.tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        # the package versions contain the codename, so the file names are different
        run: gh release upload "$TAG" debs/*/*.deb --clobber --repo "$GITHUB_REPOSITORY"
      - name: Upload to Cloudsmith
        if: ${{ env.CLOUDSMITH_API_KEY != '' && env.CLOUDSMITH_REPOSITORY != '' }}
        run: |
          pipx install cloudsmith-cli
          for dir in debs/debs-*; do
            name=${dir#debs/debs-}   # <distro>-<codename>-<arch>
            distro=${name%%-*}
            rest=${name#*-}
            codename=${rest%-*}
            for deb in "$dir"/*.deb; do
              cloudsmith push deb "$CLOUDSMITH_REPOSITORY/$distro/$codename" "$deb"
            done
          done

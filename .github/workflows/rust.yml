name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
      
env:
  CARGO_TERM_COLOR: always
  CARGO_HOME: ${{ github.workspace }}/.cargo
  RUSTFLAGS: -D warnings -A unused-imports
  RUSTDOCFLAGS: -D warnings
  RUST_BACKTRACE: full
  LLVM_VERSION: "17"

jobs:
  rustfmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable --no-self-update
      - run: rustc -Vv
      - run: cargo fmt --all -- --check

  unit-tests:
    name: ${{ matrix.basename }} - ${{ matrix.os }} - ${{ matrix.toolchain }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
        matrix:
          book:
            - false
          coverage:
            - false
          experimental:
            - false
          clippy:
            - false
          rustdoc:
            - false
          tests:
            - true
          toolchain:
            - stable
          basename:
            - Tests
          os:
            - ubuntu-latest
            - macos-latest
            - macos-15-intel
            - windows-latest
          include:
            - toolchain: stable
              os: ubuntu-latest
              tests: false
              clippy: false
              experimental: true
              basename: Coverage
              coverage: true
              book: false
            - toolchain: stable
              os: ubuntu-latest
              tests: false
              clippy: false
              experimental: false
              basename: Book
              coverage: false
              book: true
            - toolchain: beta
              os: ubuntu-latest
              experimental: true
              tests: true
              basename: Tests
              coverage: false
              book: false
            - toolchain: nightly
              os: ubuntu-latest
              tests: true
              experimental: true
              basename: Tests
              coverage: false
              book: false
            - toolchain: stable
              os: ubuntu-latest
              tests: false
              clippy: true
              experimental: true
              basename: Clippy
              coverage: false
              book: false
            - toolchain: nightly
              os: ubuntu-latest
              tests: false
              rustdoc: true
              experimental: true
              basename: Rustdoc
              coverage: false
              book: false

    steps:
    - uses: actions/checkout@v4
    - name: Extract README code example
      run: python3 ./.github/workflows/extract_readme_code.py
    - uses: actions/cache@v4
      with:
        path: |
          ${{ env.CARGO_HOME }}
          target
        key: diffsol-${{ runner.os }}-${{ matrix.toolchain}}-coverage${{ matrix.coverage }}-book${{ matrix.book }}-llvm17
    - name: Set up Rust
      run: rustup default ${{ matrix.toolchain }} && rustup update ${{ matrix.toolchain }} --no-self-update && rustup component add clippy
    - name: Install Enzyme backend
      if: matrix.toolchain == 'nightly'
      run: rustup +nightly component add enzyme
    - name: Rust version
      run: rustc -Vv
    - name: Free Disk Space (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      uses: jlumbroso/free-disk-space@main
      with:
        android: true
        dotnet: true
        haskell: true
        large-packages: false
        docker-images: true
        swap-storage: true
    - name: Install LLVM and Clang
      uses: KyleMayes/install-llvm-action@v2
      if : (matrix.os == 'ubuntu-latest' || matrix.os == 'macos-latest') && matrix.book == false
      with:
        version: ${{ env.LLVM_VERSION }}
    - name: Install LLVM for macOS Intel (Homebrew)
      if: matrix.os == 'macos-15-intel' && matrix.book == false
      run: |
        brew install llvm@${{ env.LLVM_VERSION }}
        echo /usr/local/opt/llvm@${{ env.LLVM_VERSION }}/bin >> $GITHUB_PATH
    - name: Set features variable and install dependencies (Ubuntu - not coverage)
      if: matrix.os == 'ubuntu-latest' && matrix.book == false && matrix.coverage == false
      run: |
        echo "ADDITIONAL_FEATURES_FLAGS=--features diffsl-llvm17 --features diffsl-cranelift --features suitesparse --features diffsl-external-f64 --features diffsl-external-dynamic" >> $GITHUB_ENV
        sudo apt-get update
        sudo apt-get install -y libsuitesparse-dev
    - name: Set features variable and install dependencies (Ubuntu - coverage)
      if: matrix.os == 'ubuntu-latest' && matrix.book == false && matrix.coverage == true
      run: |
        echo "ADDITIONAL_FEATURES_FLAGS=--features diffsl-llvm17 --features diffsl-cranelift --features suitesparse --features diffsl-external-dynamic" >> $GITHUB_ENV
        sudo apt-get update
        sudo apt-get install -y libsuitesparse-dev
    - name: Install Trunk
      uses: jetli/trunk-action@v0.4.0
      if: matrix.book == true
    - name: Setup mdBook
      uses: peaceiris/actions-mdbook@v2
      if: matrix.book == true
      with:
        mdbook-version: '0.4.52'
    - name: Setup mdBook tabs
      if: matrix.book == true
      run: |
        cargo install mdbook-tabs --version 0.2.3
        echo "${CARGO_HOME}/bin" >> $GITHUB_PATH
    - name: Install tarpaulin
      if: matrix.coverage == true
      run: cargo install cargo-tarpaulin
    - name: Set features variable and install dependencies (macOS)
      if:  matrix.os == 'macos-latest'
      run: |
        echo "ADDITIONAL_FEATURES_FLAGS=--features diffsl-llvm17 --features diffsl-cranelift --features diffsl-external-dynamic" >> $GITHUB_ENV
    - name: Set features variable and install dependencies (Windows)
      if: matrix.os == 'windows-latest' || matrix.os == 'macos-15-intel'
      run: |
        echo "ADDITIONAL_FEATURES_FLAGS=--features diffsl-cranelift --features diffsl-external-dynamic" >> $GITHUB_ENV
    - name: Run tests - default features
      if: matrix.tests == true
      run: cargo test --verbose
    - name: Enable autodiff (nightly)
      if: matrix.tests == true && matrix.toolchain == 'nightly'
      run: |
        echo "ADDITIONAL_FEATURES_FLAGS=${ADDITIONAL_FEATURES_FLAGS} --features autodiff" >> $GITHUB_ENV
        echo "ADDITIONAL_TEST_FLAGS=--release" >> $GITHUB_ENV
        echo "RUSTC_WRAPPER=${{ github.workspace }}/.github/scripts/autodiff-rustc-wrapper.sh" >> $GITHUB_ENV
        echo "CARGO_PROFILE_RELEASE_LTO=fat" >> $GITHUB_ENV
        echo "RUSTDOCFLAGS=${RUSTDOCFLAGS} -Zautodiff=Enable" >> $GITHUB_ENV
    - name: Run tests - all features (macOS Intel)
      if: matrix.tests == true && matrix.os == 'macos-15-intel'
      run: cargo test --verbose ${{ env.ADDITIONAL_FEATURES_FLAGS || '' }} ${{ env.ADDITIONAL_TEST_FLAGS || '' }} --workspace --exclude neural-ode-weather-prediction
    - name: Run tests - all features
      if: matrix.tests == true && matrix.os != 'macos-15-intel'
      run: cargo test --verbose ${{ env.ADDITIONAL_FEATURES_FLAGS || '' }} ${{ env.ADDITIONAL_TEST_FLAGS || '' }} --workspace
    - name: Clippy - all features
      if: matrix.clippy == true
      run: cargo clippy --verbose ${{ env.ADDITIONAL_FEATURES_FLAGS || ''}} --workspace
    - name: Docs - all features
      if: matrix.rustdoc == true
      run: cargo rustdoc -p diffsol ${{ env.ADDITIONAL_FEATURES_FLAGS || ''}}
    - name: Build book and wasm examples
      if: matrix.book == true
      run: |
        mdbook build book
        rustup target add wasm32-unknown-unknown
        cd examples/population-dynamics-wasm-yew
        mkdir -p ${{ github.workspace }}/book/book/examples/population-dynamics-wasm-yew
        trunk build --release --public-url /diffsol/examples/population-dynamics-wasm-yew/ --dist ${{ github.workspace }}/book/book/examples/population-dynamics-wasm-yew
    - name: Generate coverage report
      if: matrix.coverage == true
      run: cargo tarpaulin --engine llvm --out Xml --packages diffsol --packages diffsol-c --packages diffsol-la --packages diffsol-nl ${{ env.ADDITIONAL_FEATURES_FLAGS || '' }}
    - name: Upload coverage
      uses: codecov/codecov-action@v5
      if: matrix.coverage == true
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: cobertura.xml
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      if: matrix.book == true
      with:
        path: "book/book/"
        
  gpu-tests:
    name: "CUDA Tests - Ubuntu - stable"
    runs-on:
      - codebuild-diffsol-${{ github.run_id }}-${{ github.run_attempt }}
    continue-on-error: true
    steps:
    - uses: actions/checkout@v4
    - uses: actions/cache@v4
      with:
        path: |
          ${{ env.CARGO_HOME }}
          target
        key: diffsol-github
    - name: install rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        components: clippy
    - name: Rust version
      run: rustc -Vv
    - name: Install LLVM and Clang
      uses: KyleMayes/install-llvm-action@v2
      with:
        version: ${{ env.LLVM_VERSION }}
    - name: Check GPU driver version
      run: nvidia-smi
    - uses: Jimver/cuda-toolkit@master
      with:
        cuda: "11.8.0"
    - name: Set features variable and install dependencies
      run: |
        echo "ADDITIONAL_FEATURES_FLAGS=--features diffsl-llvm17 --features diffsl-cranelift --features suitesparse --features cuda" >> $GITHUB_ENV
        sudo apt-get update
        sudo apt-get install -y libsuitesparse-dev cmake
    - name: Run tests - all features
      run: cargo test --verbose ${{ env.ADDITIONAL_FEATURES_FLAGS || '' }} --workspace
    - name: Clippy - all features
      run: cargo clippy --verbose ${{ env.ADDITIONAL_FEATURES_FLAGS || ''}} --workspace
    - name: Install tarpaulin
      run: cargo install cargo-tarpaulin
    - name: Generate coverage report
      run: cargo tarpaulin --engine llvm --out Xml --packages diffsol --packages diffsol-la --packages diffsol-nl ${{ env.ADDITIONAL_FEATURES_FLAGS || '' }}
    - name: Upload coverage
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: cobertura.xml
        flags: gpu

  cuda-oxide-compile:
    name: "cuda-oxide Compile/Clippy - Ubuntu - nightly-2026-08-28"
    runs-on: ubuntu-latest
    #  Build-only for now until we get a cuda 13 enabled runner
    timeout-minutes: 75
    env:
      OXIDE_NIGHTLY: nightly-2026-08-28
      # Same rev as the cuda-device/cuda-host pin in crates/diffsol-la/Cargo.toml
      # and as `oxide_rev` in the Justfile
      OXIDE_REV: 26754ae52c26c097dc1c465a1e42c4c5d05a3d40
      OXIDE_ARCH: sm_86
      # Overrides the workflow-level RUSTFLAGS: -Znext-solver=coherence works
      # around a rustc ICE on this nightly (rust-lang/rust#162323)
      RUSTFLAGS: -Znext-solver=coherence
    steps:
    - uses: actions/checkout@v4
    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@main
      with:
        android: true
        dotnet: true
        haskell: true
        large-packages: false
        docker-images: true
        swap-storage: true
    - name: Set up Rust
      run: |
        rustup toolchain install ${OXIDE_NIGHTLY} --no-self-update \
          --component rust-src,rustc-dev,llvm-tools,clippy
        rustup run ${OXIDE_NIGHTLY} rustc -Vv
    - uses: Jimver/cuda-toolkit@v0.2.35
      with:
        cuda: "13.1.1"
        method: network
    - name: Cache cargo and cuda-oxide backend
      id: oxide-cache
      uses: actions/cache@v4
      with:
        # Cache the backend .so only. 
        # Key carries the nightly (the .so links that toolchain's
        # librustc_driver) and the cuda-oxide rev.
        path: |
          ${{ env.CARGO_HOME }}/bin
          ${{ env.CARGO_HOME }}/registry
          ${{ env.CARGO_HOME }}/git
          ${{ env.CARGO_HOME }}/cuda-oxide-backend/librustc_codegen_cuda.so
          target
        key: diffsol-oxide-${{ runner.os }}-nightly-2026-08-28-26754ae
    - name: Install cargo-oxide
      if: steps.oxide-cache.outputs.cache-hit != 'true'
      run: |
        cargo +${OXIDE_NIGHTLY} install --locked \
          --git https://github.com/NVlabs/cuda-oxide.git --rev ${OXIDE_REV} cargo-oxide
    - name: Put cargo bin on PATH
      run: echo "${CARGO_HOME}/bin" >> $GITHUB_PATH
    # cargo-oxide normally locates the backend by resolving this project's
    # cuda-device/cuda-host dependency with `cargo metadata --all-features`,
    # which this workspace cannot satisfy. Build the backend from the pinned
    # checkout instead and hand it over via CUDA_OXIDE_BACKEND.
    - name: Check out cuda-oxide at the pinned rev
      if: steps.oxide-cache.outputs.cache-hit != 'true'
      uses: actions/checkout@v4
      with:
        repository: NVlabs/cuda-oxide
        ref: ${{ env.OXIDE_REV }}
        path: cuda-oxide-src
    - name: Build the codegen backend
      if: steps.oxide-cache.outputs.cache-hit != 'true'
      working-directory: cuda-oxide-src
      run: |
        cargo +${OXIDE_NIGHTLY} oxide setup
        so="$(find crates/rustc-codegen-cuda/target -name librustc_codegen_cuda.so | head -1)"
        mkdir -p "${CARGO_HOME}/cuda-oxide-backend"
        cp "${so}" "${CARGO_HOME}/cuda-oxide-backend/librustc_codegen_cuda.so"
    - name: Point cuda-oxide at the backend
      run: |
        echo "CUDA_OXIDE_BACKEND=${CARGO_HOME}/cuda-oxide-backend/librustc_codegen_cuda.so" \
          >> $GITHUB_ENV
    - name: Environment check (non-fatal)
      # Just FYI, exits 1 on this repo purely because there is no rust-toolchain.toml,
      run: cargo +${OXIDE_NIGHTLY} oxide doctor || true
    - name: Compile tests - cuda-oxide
      run: |
        sysroot="$(rustup run ${OXIDE_NIGHTLY} rustc --print sysroot)"
        export LIBRARY_PATH="${sysroot}/lib:${LIBRARY_PATH:-}"
        export LD_LIBRARY_PATH="${sysroot}/lib:${LD_LIBRARY_PATH:-}"
        cargo +${OXIDE_NIGHTLY} oxide test --arch ${OXIDE_ARCH} -- \
          --workspace --features cuda-oxide --no-run
    - name: Clippy - cuda-oxide
      run: |
        cargo +${OXIDE_NIGHTLY} clippy --workspace --features cuda-oxide \
          --all-targets -- -D warnings -A unused-imports

  deploy:
    if: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Release-plz

on:
  push:
    branches:
      - main

jobs:

  # Release unpublished packages.
  release-plz-release:
    name: Release-plz release
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'martinjrobins' }}
    permissions:
      contents: write
      pull-requests: read
    outputs:
      diffsol_c_tag: ${{ steps.diffsol-c.outputs.tag }}
    steps:
      - &checkout
        name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - &install-rust
        name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run release-plz
        id: release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      # the tag of the diffsol-c release, or empty if this run did not release diffsol-c
      - name: Find the diffsol-c release
        id: diffsol-c
        env:
          RELEASES: ${{ steps.release-plz.outputs.releases }}
        run: |
          tag=$(echo "${RELEASES:-[]}" | jq -r '.[] | select(.package_name == "diffsol-c") | .tag')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  # Build the Debian packages of a new diffsol-c release, and upload them to the release and to
  # Cloudsmith. The release above uses GITHUB_TOKEN, which does not start other workflows, so
  # this job calls the packaging workflow directly.
  release-diffsol-c-deb:
    name: Debian packages of diffsol-c
    needs: release-plz-release
    if: ${{ needs.release-plz-release.outputs.diffsol_c_tag != '' }}
    permissions:
      contents: write
    uses: ./.github/workflows/deb.yml
    with:
      tag: ${{ needs.release-plz-release.outputs.diffsol_c_tag }}
      publish: true
    secrets: inherit

  # Create a PR with the new versions and changelog, preparing the next release.
  release-plz-pr:
    name: Release-plz PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - *checkout
      - *install-rust
      # release-plz runs `cargo-semver-checks` with no feature flags, so it falls back to that
      # tool's heuristic: every feature except `unstable`/`nightly`/`bench`/`no_std` and
      # `_`-prefixed names.
      #
      # Neither tool can express "skip these features", so this shadows the binary with a 
      # wrapper that checks the default features.
      # TODO: missing all the optional features, do we need these?
      - name: Limit cargo-semver-checks to default features
        run: |
          mkdir -p "$RUNNER_TEMP/semver-shim"
          cat > "$RUNNER_TEMP/semver-shim/cargo-semver-checks" <<'SHIM'
          #!/usr/bin/env bash
          set -euo pipefail
          self_dir=$(cd "$(dirname "$0")" && pwd)
          IFS=: read -ra path_dirs <<< "$PATH"
          for dir in "${path_dirs[@]}"; do
            if [ "$dir" = "$self_dir" ]; then continue; fi
            if [ -x "$dir/cargo-semver-checks" ]; then
              exec "$dir/cargo-semver-checks" "$@" --default-features
            fi
          done
          echo "cargo-semver-checks shim: real binary not found on PATH" >&2
          exit 127
          SHIM
          chmod +x "$RUNNER_TEMP/semver-shim/cargo-semver-checks"
          echo "$RUNNER_TEMP/semver-shim" >> "$GITHUB_PATH"
      - name: Run release-plz
        id: release-plz
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      # release-plz does not update the diffsol version in the install instructions of the docs.
      # This step writes the new version to these files and pushes a commit to the release PR.
      - name: Sync the diffsol version in the docs
        env:
          PR: ${{ steps.release-plz.outputs.pr }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr=${PR:-"{}"}
          branch=$(echo "$pr" | jq -r '.head_branch // empty')
          version=$(echo "$pr" | jq -r '.releases[]? | select(.package_name == "diffsol") | .version')
          if [ -z "$branch" ] || [ -z "$version" ]; then
            echo "No release PR for diffsol, nothing to do"
            exit 0
          fi
          # the cargo version requirement: "0.21" for 0.x versions, "1" for 1.0 and later
          IFS=. read -r major minor _ <<< "$version"
          if [ "$major" = 0 ]; then req="$major.$minor"; else req="$major"; fi

          git fetch origin "$branch"
          git checkout "$branch"
          files="README.md book/src/use/webassembly.md book/src/specify/closure/autodiff.md"
          sed -i -E \
            -e "s/^(diffsol = )\"[0-9.]+\"/\1\"$req\"/" \
            -e "s/^(diffsol = \{ version = )\"[0-9.]+\"/\1\"$req\"/" \
            $files
          if git diff --quiet; then
            echo "The docs already use diffsol $req"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git commit -am "docs: update the diffsol version in the docs to $req"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$branch"
